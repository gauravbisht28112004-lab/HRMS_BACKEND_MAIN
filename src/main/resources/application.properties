# Application Configuration
spring.application.name=finbud-hrms
server.port=${SERVER_PORT:8080}

# Database Configuration
# DB_PASSWORD MUST be supplied via environment variable (IntelliJ run config
# locally, Render dashboard in production). There is intentionally NO default
# — a leaked default password is a security risk, and a missing one should
# fail fast at startup so you notice immediately, not silently connect with
# the wrong credentials.
#
# Local dev: set DB_PASSWORD=postgres in your IntelliJ run configuration's
# Environment variables field. The docker-compose.yml seeds Postgres with
# password "postgres".
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# JWT Configuration
# CRITICAL: APP_JWT_SECRET MUST be set as an environment variable (or in
# application-local.properties / IntelliJ run config for dev). There is
# intentionally NO default — anyone who could read a default here could
# forge admin tokens against any deployment. The app will fail fast at
# startup if APP_JWT_SECRET is missing.
#
# Generate a strong secret with one of:
#   openssl rand -base64 64
#   PowerShell:  [Convert]::ToBase64String((1..64 | % { Get-Random -Maximum 256 } | % { [byte]$_ }))
#
# Local dev: add APP_JWT_SECRET to your IntelliJ run config's Environment
# variables field, or use a .env file with a runner that loads it.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS — comma-separated list of allowed origins (consumed by SecurityConfig).
# Production: override via APP_CORS_ALLOWED_ORIGINS env var.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=gpt-4
openai.api.embedding-model=text-embedding-3-small
openai.api.timeout=60000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Configuration
# 30 MB cap on the multipart layer leaves comfortable headroom above the
# 25 MB application-level avatar limit for HTTP boundary overhead.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
app.upload.directory=./uploads

# -------------------------------------------------------------------------
# Profile-picture storage (S3 / MinIO)
# -------------------------------------------------------------------------
# The portal stores employee profile pictures in an S3-compatible object
# store. It works with:
#   * Local MinIO (dev): endpoint=http://localhost:9000, path-style=true
#   * Real AWS S3 (prod): leave endpoint blank, region=<aws region>,
#     credentials via env vars or instance profile.
#
# finbud.storage.s3.enabled
#   If false, avatar upload endpoints short-circuit with 503. Useful for
#   CI or very first-boot scenarios where no bucket is reachable yet.
#
# finbud.storage.s3.endpoint
#   Blank = real AWS S3. For MinIO, e.g. http://localhost:9000.
#
# finbud.storage.s3.path-style-access
#   MUST be true for MinIO. For real AWS S3, false is fine (virtual-hosted
#   buckets) unless the bucket name contains dots.
#
# finbud.storage.s3.public-base-url
#   Optional. If set, presigned URLs are rewritten to this base so the
#   frontend can fetch via a CDN / reverse-proxy hostname different from
#   the one the backend uses to talk to S3 (common with dockerised MinIO
#   where the backend speaks to http://minio:9000 but the browser needs
#   http://localhost:9000).
#
# finbud.storage.s3.presign-ttl-seconds
#   Lifetime of the presigned GET URL returned in EmployeeResponse. Keep
#   it long enough to cover a page view but short enough that a leaked
#   URL expires quickly. 3600 = 1 hour is a sensible default.
#
# finbud.storage.s3.max-upload-bytes
#   Hard cap on avatar size, enforced in the controller *before* we hit
#   S3. Also duplicated client-side.
#
# finbud.storage.s3.allowed-content-types
#   Comma-separated MIME allow-list. Anything else is rejected with 400.
# -------------------------------------------------------------------------
finbud.storage.s3.enabled=${FINBUD_S3_ENABLED:true}
# Defaults below assume real AWS S3. For MinIO local dev, override via env vars
# (FINBUD_S3_ENDPOINT=http://localhost:9000, FINBUD_S3_PATH_STYLE=true,
# FINBUD_S3_ACCESS_KEY=minioadmin, FINBUD_S3_SECRET_KEY=minioadmin).
finbud.storage.s3.endpoint=${FINBUD_S3_ENDPOINT:}
finbud.storage.s3.region=${FINBUD_S3_REGION:ap-south-1}
finbud.storage.s3.bucket=${FINBUD_S3_BUCKET:finbud-hrms-avatars}
finbud.storage.s3.access-key=${FINBUD_S3_ACCESS_KEY:}
finbud.storage.s3.secret-key=${FINBUD_S3_SECRET_KEY:}
finbud.storage.s3.path-style-access=${FINBUD_S3_PATH_STYLE:false}
finbud.storage.s3.public-base-url=${FINBUD_S3_PUBLIC_BASE_URL:}
finbud.storage.s3.presign-ttl-seconds=${FINBUD_S3_PRESIGN_TTL_SECONDS:3600}
finbud.storage.s3.max-upload-bytes=${FINBUD_S3_MAX_UPLOAD_BYTES:26214400}
finbud.storage.s3.allowed-content-types=${FINBUD_S3_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
finbud.storage.s3.auto-create-bucket=${FINBUD_S3_AUTO_CREATE_BUCKET:true}

# Scheduling Configuration
app.scheduler.payroll.cron=0 0 1 1 * ?
app.scheduler.attendance.cron=0 0 23 * * ?
app.scheduler.leave.cron=0 0 0 1 1 ?

# Logging Configuration
logging.level.com.financebuddha.finbud.hrms=INFO
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Application Info
info.app.name=Finbud HRMS
info.app.description=Enterprise HR Management System
info.app.version=1.0.0
