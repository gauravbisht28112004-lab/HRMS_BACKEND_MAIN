# Application Configuration
spring.application.name=finbud-hrms
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/finbud_hrms
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# JWT Configuration
app.jwt.secret=finbud-hrms-secret-key-must-be-at-least-256-bits-long-for-hs512-algorithm-security
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=gpt-4
openai.api.embedding-model=text-embedding-3-small
openai.api.timeout=60000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.directory=./uploads

# Scheduling Configuration
app.scheduler.payroll.cron=0 0 1 1 * ?
app.scheduler.attendance.cron=0 0 23 * * ?
app.scheduler.leave.cron=0 0 0 1 1 ?

# Logging Configuration
logging.level.com.financebuddha.finbud.hrms=INFO
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Application Info
info.app.name=Finbud HRMS
info.app.description=Enterprise HR Management System
info.app.version=1.0.0
