# Production Profile Configuration
# All sensitive values are sourced from env vars with NO defaults — Spring
# fails fast at startup if any required variable is missing, which is the
# behaviour we want for production. See README for the full env-var contract.
spring.config.activate.on-profile=prod

# Database Configuration (Production) — required env vars
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA/Hibernate Configuration (Production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Connection Pool Configuration (Production)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

# JWT — required, no fallback. Generate with `openssl rand -base64 64`.
app.jwt.secret=${APP_JWT_SECRET}
# 1 hour access tokens in prod (vs 24 hours in dev) to limit blast radius.
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS — required, no fallback. Comma-separated list of allowed origins.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Logging Configuration (Production)
logging.level.com.financebuddha.finbud.hrms=WARN
logging.level.root=WARN
logging.level.org.springframework.security=WARN
logging.file.name=/var/log/finbud-hrms/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Security Configuration (Production)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Actuator — restrict surface area in prod
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
